<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STASIS Forest Rover</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101513;
        color: #edf4ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(135deg, rgba(39, 83, 70, 0.28), transparent 38%),
          linear-gradient(225deg, rgba(141, 125, 77, 0.18), transparent 42%),
          #101513;
      }

      main {
        display: grid;
        grid-template-columns: minmax(320px, 800px) minmax(280px, 1fr);
        gap: 24px;
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 24px 0;
      }

      h1,
      h2 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0;
      }

      .panel {
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        gap: 12px;
      }

      .status {
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.82rem;
        color: #c5d6cc;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
      }

      .controls button {
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 8px;
        background: rgba(237, 244, 239, 0.08);
        color: #edf4ef;
        cursor: pointer;
        font: inherit;
        font-size: 0.88rem;
        padding: 8px 10px;
      }

      .guidance {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 8px;
        padding: 12px;
        background: rgba(237, 244, 239, 0.06);
      }

      .guidance strong {
        color: #f5f0c9;
        font-size: 1.15rem;
      }

      .guidance span {
        color: #c5d6cc;
      }

      .telemetry {
        margin-top: 10px;
        color: #c5d6cc;
        font-size: 0.92rem;
      }

      .event-status {
        margin-bottom: 12px;
        color: #c5d6cc;
        font-size: 0.92rem;
      }

      .camera-feed {
        margin-bottom: 16px;
      }

      .camera-feed img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 8px;
        background: #0a0f0d;
        object-fit: cover;
      }

      #map {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 8px;
        background:
          linear-gradient(rgba(237, 244, 239, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(237, 244, 239, 0.08) 1px, transparent 1px),
          radial-gradient(circle at 26% 30%, rgba(107, 145, 99, 0.3), transparent 22%),
          radial-gradient(circle at 70% 66%, rgba(154, 125, 64, 0.24), transparent 24%),
          #17201b;
        background-size:
          40px 40px,
          40px 40px,
          auto,
          auto,
          auto;
        cursor: crosshair;
      }

      #rover {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid #f5f0c9;
        background: #2ca58d;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 6px rgba(44, 165, 141, 0.18);
      }

      #rover::after {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 30px;
        content: "";
        background: #58c4ff;
        border-radius: 999px;
        transform: translate(-50%, -100%) rotate(var(--yaw, 0deg));
        transform-origin: 50% 100%;
      }

      #rover::before {
        position: absolute;
        left: 50%;
        top: -22px;
        width: 0;
        height: 0;
        content: "";
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-bottom: 10px solid #58c4ff;
        transform: translateX(-50%) rotate(var(--yaw, 0deg));
        transform-origin: 50% 31px;
      }

      #goal {
        position: absolute;
        display: none;
        width: 22px;
        height: 22px;
        border: 2px solid #f19a3e;
        border-radius: 50%;
        transform: translate(-50%, -50%);
      }

      #trackedTarget {
        position: absolute;
        display: none;
        width: 26px;
        height: 26px;
        border: 3px solid #ffcf5a;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 6px rgba(255, 207, 90, 0.2);
      }

      #trackedTarget::after {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8px;
        height: 8px;
        content: "";
        border-radius: 50%;
        background: #ffcf5a;
        transform: translate(-50%, -50%);
      }

      #goal::before,
      #goal::after {
        position: absolute;
        content: "";
        background: #f19a3e;
      }

      #goal::before {
        left: 50%;
        top: -7px;
        width: 2px;
        height: 32px;
      }

      #goal::after {
        left: -7px;
        top: 50%;
        width: 32px;
        height: 2px;
      }

      .alerts {
        display: grid;
        gap: 12px;
      }

      .scan {
        margin-top: 18px;
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 8px;
        overflow: hidden;
      }

      .scan table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .scan th,
      .scan td {
        border-bottom: 1px solid rgba(237, 244, 239, 0.12);
        padding: 8px 10px;
        text-align: left;
      }

      .scan th {
        color: #c5d6cc;
        font-weight: 600;
      }

      .alert {
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 8px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.04);
      }

      .alert img {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 10;
        object-fit: cover;
      }

      .alert p {
        margin: 0;
        padding: 10px 12px;
        color: #e6eee9;
        line-height: 1.35;
      }

      .alert .category {
        display: inline-block;
        margin: 10px 12px 0;
        border: 1px solid rgba(237, 244, 239, 0.16);
        border-radius: 999px;
        padding: 3px 8px;
        color: #d9e8dd;
        font-size: 0.76rem;
        text-transform: uppercase;
      }

      .track-alert {
        margin: 0 12px 12px;
        border: 1px solid rgba(245, 240, 201, 0.35);
        border-radius: 8px;
        background: rgba(245, 240, 201, 0.1);
        color: #f5f0c9;
        cursor: pointer;
        font: inherit;
        padding: 8px 10px;
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="topbar">
          <h1>STASIS Forest Rover</h1>
          <div id="status" class="status">offline</div>
        </div>
        <div class="controls">
          <button id="startRobot" type="button">Start Robot</button>
          <button id="stopRover" type="button">Stop</button>
          <button id="returnHome" type="button">Return to Home</button>
          <button id="scanArea" type="button">Scan Area</button>
          <button id="searchRedStrip" type="button">Search Red Strip</button>
          <button id="goToRedStrip" type="button">Go to Red Strip</button>
        </div>
        <div class="event-status">Rover status: <span id="roverStatus">waiting</span></div>
        <section class="guidance" aria-label="Tracking guidance" aria-live="polite">
          <span>Tracking: <span id="trackingName">none</span></span>
          <strong id="guidanceDirection">select a human alert</strong>
          <span>Distance: <span id="guidanceDistance">--</span> cm</span>
        </section>
        <section class="camera-feed" aria-label="Webcam feed">
          <img src="/camera.mjpg" alt="Raspberry Pi webcam feed" />
        </section>
        <div id="map" aria-label="Rover map">
          <div id="goal"></div>
          <div id="trackedTarget"></div>
          <div id="rover"></div>
        </div>
        <div class="telemetry">Distance from home: <span id="homeDistance">0</span> cm</div>
        <section class="scan" aria-label="Ultrasonic scan results">
          <table>
            <thead>
              <tr>
                <th>Scan point</th>
                <th>Distance</th>
              </tr>
            </thead>
            <tbody id="scanResults">
              <tr>
                <td colspan="2">No scan yet</td>
              </tr>
            </tbody>
          </table>
        </section>
      </section>

      <section class="panel">
        <div class="topbar">
          <h2>Alerts</h2>
        </div>
        <div id="alerts" class="alerts"></div>
      </section>
    </main>

    <script>
      const socket = io();
      const statusEl = document.getElementById("status");
      const mapEl = document.getElementById("map");
      const roverEl = document.getElementById("rover");
      const goalEl = document.getElementById("goal");
      const alertsEl = document.getElementById("alerts");
      const trackedTargetEl = document.getElementById("trackedTarget");
      const trackingNameEl = document.getElementById("trackingName");
      const guidanceDirectionEl = document.getElementById("guidanceDirection");
      const guidanceDistanceEl = document.getElementById("guidanceDistance");
      const homeDistanceEl = document.getElementById("homeDistance");
      const startRobotBtn = document.getElementById("startRobot");
      const stopRoverBtn = document.getElementById("stopRover");
      const returnHomeBtn = document.getElementById("returnHome");
      const scanAreaBtn = document.getElementById("scanArea");
      const searchRedStripBtn = document.getElementById("searchRedStrip");
      const goToRedStripBtn = document.getElementById("goToRedStrip");
      const scanResultsEl = document.getElementById("scanResults");
      const roverStatusEl = document.getElementById("roverStatus");

      const mapSize = 800;
      let roverPose = { x: 400, y: 400, yaw: 0 };
      let trackedAlert = null;
      let lastSpokenGuidance = "";

      function positionMarker(marker, x, y) {
        marker.style.left = `${(x / mapSize) * 100}%`;
        marker.style.top = `${(y / mapSize) * 100}%`;
      }

      function renderPose() {
        positionMarker(roverEl, roverPose.x, roverPose.y);
        roverEl.style.setProperty("--yaw", `${roverPose.yaw || 0}deg`);
        homeDistanceEl.textContent = Math.round(roverPose.distance_from_home || 0);
        updateGuidance(false);
      }

      function normalizeTurn(value) {
        let turn = value;
        while (turn > Math.PI) turn -= Math.PI * 2;
        while (turn < -Math.PI) turn += Math.PI * 2;
        return turn;
      }

      function guidanceTextForTarget(target) {
        if (target.guidance && target.guidance.direction) {
          const distance = Number(target.guidance.forward_cm || target.guidance.distance_cm || 0);
          return { distance: Math.max(0, Math.round(distance)), direction: target.guidance.direction };
        }
        const dx = target.x - roverPose.x;
        const dy = target.y - roverPose.y;
        const distance = Math.max(0, Math.round(Math.hypot(dx, dy)));

        if (distance <= 25) {
          return { distance, direction: `${target.category || "target"} nearby` };
        }

        const targetBearing = Math.atan2(dy, dx);
        const roverBearing = ((Number(roverPose.yaw) || 0) * Math.PI) / 180;
        const turn = normalizeTurn(targetBearing - roverBearing);

        if (Math.abs(turn) <= 0.44) return { distance, direction: "move forward" };
        if (Math.abs(turn) >= 2.53) return { distance, direction: "turn back" };
        return { distance, direction: turn > 0 ? "move right" : "move left" };
      }

      function speakGuidance(text) {
        if (text === lastSpokenGuidance || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        lastSpokenGuidance = text;
      }

      function updateGuidance(shouldSpeak) {
        if (!trackedAlert) {
          trackedTargetEl.style.display = "none";
          trackingNameEl.textContent = "none";
          guidanceDirectionEl.textContent = "select a human alert";
          guidanceDistanceEl.textContent = "--";
          return;
        }

        positionMarker(trackedTargetEl, trackedAlert.x, trackedAlert.y);
        trackedTargetEl.style.display = "block";

        const guidance = guidanceTextForTarget(trackedAlert);
        trackingNameEl.textContent = trackedAlert.label || trackedAlert.category || "event";
        guidanceDirectionEl.textContent = guidance.direction;
        guidanceDistanceEl.textContent = guidance.distance;

        if (shouldSpeak) {
          speakGuidance(`${guidance.direction}. ${guidance.distance} centimeters.`);
        }
      }

      function scanPointLabel(angle) {
        const value = Number(angle);
        if (!Number.isFinite(value)) return "scan point";
        if (value < 60) return "left side";
        if (value > 120) return "right side";
        return "front side";
      }

      function renderScan(scan) {
        const points = Array.isArray(scan.data) ? scan.data : [];
        scanResultsEl.textContent = "";

        if (!points.length) {
          const row = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = 2;
          cell.textContent = "No scan yet";
          row.append(cell);
          scanResultsEl.append(row);
          return;
        }

        for (const point of points) {
          const row = document.createElement("tr");
          const angle = document.createElement("td");
          const distance = document.createElement("td");
          angle.textContent = scanPointLabel(point.angle);
          distance.textContent = point.distance < 0 ? "No echo" : `${Math.round(point.distance)} cm`;
          row.append(angle, distance);
          scanResultsEl.append(row);
        }
      }

      socket.on("connect", () => {
        statusEl.textContent = "online";
      });

      socket.on("disconnect", () => {
        statusEl.textContent = "offline";
      });

      socket.on("rover_position", (pose) => {
        roverPose = pose;
        renderPose();
      });

      socket.on("scan_data", renderScan);

      socket.on("rover_status", (payload) => {
        roverStatusEl.textContent = payload.message
          ? `${payload.status}: ${payload.message}`
          : payload.status || "waiting";
      });

      socket.on("marker_seen", (marker) => {
        roverStatusEl.textContent = `marker seen: ${marker.name}`;
      });

      socket.on("marker_error", (payload) => {
        roverStatusEl.textContent = payload.message || `Marker not found: ${payload.marker}`;
      });

      socket.on("new_alert", (alert) => {
        const item = document.createElement("article");
        item.className = "alert";

        const img = document.createElement("img");
        img.src = `/${alert.image_path}`;
        img.alt = "Alert snapshot";

        const category = document.createElement("span");
        category.className = "category";
        category.textContent = alert.category || "event";

        const message = document.createElement("p");
        message.textContent = alert.message || "Activity detected";

        item.append(img, category, message);

        const x = Number(alert.x);
        const y = Number(alert.y);
        if (Number.isFinite(x) && Number.isFinite(y)) {
          const trackButton = document.createElement("button");
          trackButton.className = "track-alert";
          trackButton.type = "button";
          trackButton.textContent = "Track";
          trackButton.addEventListener("click", () => {
            trackedAlert = { ...alert, x, y };
            roverStatusEl.textContent =
              alert.category === "human" ? "human detected - tracking" : `${alert.category || "event"} selected - tracking`;
            updateGuidance(true);
          });
          item.append(trackButton);
        }

        if (alert.category === "human") {
          roverStatusEl.textContent = "human detected - press Track";
        }
        alertsEl.prepend(item);
      });

      mapEl.addEventListener("click", (event) => {
        const rect = mapEl.getBoundingClientRect();
        const x = Math.round(((event.clientX - rect.left) / rect.width) * mapSize);
        const y = Math.round(((event.clientY - rect.top) / rect.height) * mapSize);

        positionMarker(goalEl, x, y);
        goalEl.style.display = "block";
        socket.emit("set_goal", { x, y });
      });

      startRobotBtn.addEventListener("click", () => {
        roverStatusEl.textContent = "robot started - scanning";
        socket.emit("request_scan");
      });

      stopRoverBtn.addEventListener("click", () => {
        socket.emit("stop_rover");
      });

      returnHomeBtn.addEventListener("click", () => {
        socket.emit("return_home");
      });

      scanAreaBtn.addEventListener("click", () => {
        socket.emit("request_scan");
      });

      searchRedStripBtn.addEventListener("click", () => {
        socket.emit("search_marker", { marker: "red_strip" });
      });

      goToRedStripBtn.addEventListener("click", () => {
        socket.emit("go_to_marker", { marker: "red_strip" });
      });

      renderPose();
    </script>
  </body>
</html>
