; =======================================================================
; STASIS — ESP32-CAM PlatformIO Configuration
; Framework: ESP-IDF (NOT Arduino)
; Board:     AI-Thinker ESP32-CAM
;
; Quick Start:
;   1. Install PlatformIO CLI or VS Code extension
;   2. Run: pio run            (build)
;   3. Run: pio run -t upload  (flash)
;   4. Run: pio device monitor (serial monitor)
;
; ESP-WHO / Face Detection Setup:
;   See components/README.md for instructions on adding the
;   esp-dl component for MTMN face detection.
;   The project compiles without it (motion-only detection).
; =======================================================================

[env:esp32cam]
platform = espressif32@5.4.0
framework = espidf
board = esp32cam

; --- Serial ---
monitor_speed = 115200
upload_speed = 921600

; --- Partition Table ---
board_build.partitions = partitions.csv

; --- Flash ---
board_build.flash_mode = dio
board_build.f_flash = 80000000L

; --- PSRAM (required for face detection) ---
build_flags =
    -DCONFIG_SPIRAM_SUPPORT=1

; --- Extra IDF components directory ---
board_build.cmake_extra_args =
    -DEXTRA_COMPONENT_DIRS=${PROJECT_DIR}/components
